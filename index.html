  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'cdws_2_0_trusted_state_v3';

      const MY_TOKENS_KEY = 'cdws_my_tokens_v1';
      const CDWS_LOCKOUT_KEY = 'cdws_lockout_v1';
      const CDWS_LAST_TOKEN_KEY = 'cdws_last_token_v1';
      let lastTokenIssueAt = (() => { try { return Number(localStorage.getItem(CDWS_LAST_TOKEN_KEY) || 0); } catch (e) { return 0; } })();
      let loginLockout = (() => { try { const r = localStorage.getItem(CDWS_LOCKOUT_KEY); return r ? JSON.parse(r) : { fails: 0, lockedUntil: 0 }; } catch (e) { return { fails: 0, lockedUntil: 0 }; } })();
      function saveLockout() { try { localStorage.setItem(CDWS_LOCKOUT_KEY, JSON.stringify(loginLockout)); } catch (e) {} }
      function saveLastTokenTime(ts) { lastTokenIssueAt = ts; try { localStorage.setItem(CDWS_LAST_TOKEN_KEY, String(ts)); } catch (e) {} }

      function getMyTokenIds() {
        try {
          const raw = localStorage.getItem(MY_TOKENS_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (e) { return []; }
      }

      function addMyTokenId(tokenId) {
        try {
          const list = getMyTokenIds();
          if (!list.includes(tokenId)) {
            list.push(tokenId);
            localStorage.setItem(MY_TOKENS_KEY, JSON.stringify(list));
          }
        } catch (e) {}
      }

      const CLOUD_CFG_KEY = 'cdws_2_0_supabase_cfg_v1';
      let bc = null;
      let supabaseClient = null;
      let supabaseChannel = null;

      try {
        if ('BroadcastChannel' in window) bc = new BroadcastChannel('cdws2_live_channel');
      } catch (e) {}

      const TENANTS = [
        {
          id: 'jdc_goveli',
          collegeName: "Jeevandeep Art's, Commerce and Science College, Goveli",
          branchName: 'Goveli Campus',
          code: 'JDC-GOV',
          w7Name: 'W7: NSS & Student Welfare',
          w7ServiceLabel: 'NSS / Extracurricular Verification'
        }
      ];

      // Zero plaintext passcodes in browser code: verifies via Supabase server RPC when connected,
      // or SHA-256 digest comparison in local-only preview mode.
      const LOCAL_PASSCODE_HASHES = {
        W1: '1707926de26556f978b3141e8b024144ae204009151205f20fcf00b791d48b9e',
        W2: 'a08bf80d732f5ca79916cdb9fb7c4414420bf65408a7c6998f9bb2c4fe38d81c',
        W3: 'ef0f98b377d206434b40c8fef645cd49913fe3fce434d228a309ef49ffad7280',
        W4: 'dc48fc97e7ad7a874085146f6726cf4c1e6145329f4005800a2e3f4865bd3363',
        W5: 'a399a573a490e2eb0154aa281a46a47f06a74e420080164ada5c8a10a9b3ba80',
        W6: 'f06a7b8bf27c3147e2198218c775b28245c0acee533c40046d34854f226cac24',
        W7: '66e7f63a415095e3d6981e517a062b38ec2cb0d9f2001bdc8d5e27ae450900e8',
        SUPERVISOR: '11cf698a2f50d2764c3a37f44e7b6c1f79f849d92be4c94b74876166fa105681',
        ADMIN: 'c4150018f7f266de19b2f235402858a66222dcfed96c958cc91d7658afbcffbf'
      };

      async function verifyPasscode(roleKey, inputCode) {
        const now = Date.now();
        if (loginLockout.lockedUntil > now) {
          const secs = Math.ceil((loginLockout.lockedUntil - now) / 1000);
          showToast(`Too many wrong attempts. Wait ${secs}s before trying again.`, 'error');
          return false;
        }
        let ok = false;
        if (supabaseClient && cloudCfg.connected) {
          try {
            const { data, error } = await supabaseClient.rpc('verify_cdws_passcode', {
              role_key: roleKey,
              input_code: inputCode
            });
            if (!error && typeof data === 'boolean') ok = data;
          } catch (e) { ok = false; }
        } else {
          try {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(inputCode));
            const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            ok = (hex === LOCAL_PASSCODE_HASHES[roleKey]);
          } catch (e) { ok = false; }
        }
        if (ok) {
          loginLockout = { fails: 0, lockedUntil: 0 };
          saveLockout();
        } else {
          loginLockout.fails++;
          if (loginLockout.fails >= 5) {
            loginLockout.lockedUntil = Date.now() + 60000;
            loginLockout.fails = 0;
          }
          saveLockout();
        }
        return ok;
      }

      function createInitialTenantState(tenant) {
        return {
          cutoffClosed: false,
          nextTokenSeq: 101,
          windows: [
            { id: 'W1', name: 'Window 1', type: 'SHARED_POOL', status: 'OPEN', servedCount: 0, currentTokenId: null },
            { id: 'W2', name: 'Window 2', type: 'SHARED_POOL', status: 'OPEN', servedCount: 0, currentTokenId: null },
            { id: 'W3', name: 'Window 3', type: 'SHARED_POOL', status: 'OPEN', servedCount: 0, currentTokenId: null },
            { id: 'W4', name: 'Window 4', type: 'SHARED_POOL', status: 'OPEN', servedCount: 0, currentTokenId: null },
            { id: 'W5', name: 'Window 5', type: 'LIBRARY', status: 'OPEN', servedCount: 0, currentTokenId: null },
            { id: 'W6', name: 'Window 6', type: 'EXAM_SCHOLARSHIP', status: 'OPEN', servedCount: 0, currentTokenId: null },
            { id: 'W7', name: tenant.w7Name, type: 'CUSTOM', status: 'OPEN', servedCount: 0, currentTokenId: null }
          ],
          services: [
            { id: 'srv_bonafide', name: 'Bonafide Certificate', desc: 'Needed for bus/train concession pass, bank account, or student ID proof.', category: 'General Admin', avgMinutes: 4, eligibleWindows: ['W1', 'W2', 'W3', 'W4'], poolType: 'SHARED_POOL', enabled: true },
            { id: 'srv_fee', name: 'Fee Receipt & Concession', desc: 'Get duplicate fee receipt, installment approval, or fee concession.', category: 'Accounts', avgMinutes: 6, eligibleWindows: ['W1', 'W2', 'W3'], poolType: 'SHARED_POOL', enabled: true },
            { id: 'srv_tc', name: 'Transfer / Leaving Certificate', desc: 'Required when leaving college, migrating, or applying for LC/TC.', category: 'General Admin', avgMinutes: 8, eligibleWindows: ['W2', 'W3', 'W4'], poolType: 'SHARED_POOL', enabled: true },
            { id: 'srv_library', name: 'Library Book Issue / No-Dues', desc: 'Borrow/return library books or get No-Dues stamp before exams.', category: 'Library', avgMinutes: 3, eligibleWindows: ['W5'], poolType: 'LIBRARY', enabled: true },
            { id: 'srv_exam', name: 'Examination Form Submission', desc: 'Submit & verify semester exam or ATKT form.', category: 'Examination', avgMinutes: 5, eligibleWindows: ['W6'], poolType: 'EXAM_SCHOLARSHIP', enabled: true },
            { id: 'srv_scholarship', name: 'Scholarship Form Verification', desc: 'MahaDBT, EBC, or minority scholarship document check.', category: 'Scholarship', avgMinutes: 7, eligibleWindows: ['W6'], poolType: 'EXAM_SCHOLARSHIP', enabled: true },
            { id: 'srv_hallticket', name: 'Hall Ticket Collection', desc: 'Collect your stamped exam admit card / hall ticket.', category: 'Examination', avgMinutes: 3, eligibleWindows: ['W6'], poolType: 'EXAM_SCHOLARSHIP', enabled: true },
            { id: 'srv_w7', name: tenant.w7ServiceLabel, desc: 'Campus-specific desk for NSS hours, certificates, or event letters.', category: 'College Custom', avgMinutes: 5, eligibleWindows: ['W7'], poolType: 'CUSTOM', enabled: true }
          ],
          tokens: [],
          documents: [],
          offlineOutbox: [],
          notices: [
            { id: 'N-1', title: 'Exam Form Submission Window 6', body: 'Carry verified fee receipt when submitting examination forms at Window 6.', priority: 'INFO', active: true, expired: false, createdAt: 'Active Notice' },
            { id: 'N-2', title: 'Previous Semester Book Return Drive (Expired)', body: 'Old textbook return drive notice from last month — eligible for cleanup.', priority: 'NORMAL', active: false, expired: true, createdAt: 'Last Month' }
          ],
          cleanupItems: [
            { id: 'CLN-N2', category: 'EXPIRED_NOTICE', title: 'Expired Notice: Previous Semester Book Return Drive', detail: 'Marked inactive/expired — safe to remove from campus storage.', refId: 'N-2', dismissed: false },
            { id: 'CLN-TMP1', category: 'UNIMPORTANT_FILE', title: 'Stale Temp Export: old_queue_snapshot_draft.csv', detail: 'Temporary draft export flagged as unimportant system file.', refId: null, dismissed: false }
          ],
          auditLogs: [
            { id: 'LOG-INIT', timestamp: new Date().toTimeString().slice(0, 8), role: 'SYSTEM', action: 'TENANT_READY', target: tenant.code, detail: 'Initialized clean zero-fake-data state.' }
          ]
        };
      }

      function buildDefaultState() {
        const tenantData = {};
        TENANTS.forEach(t => { tenantData[t.id] = createInitialTenantState(t); });
        return {
          activeTenantId: TENANTS[0].id,
          view: 'LANDING',
          session: null,
          offlineMode: false,
          noticeSlideIdx: 0,
          noticePaused: false,
          selectedServiceId: 'srv_bonafide',
          adminTab: 'ANALYTICS',
          auditFilter: 'ALL',
          cleanupSelected: {},
          tenants: tenantData
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.tenants && parsed.tenants['jdc_goveli']) { parsed.activeTenantId = 'jdc_goveli'; return parsed; }
          }
        } catch (e) {}
        return buildDefaultState();
      }

      const DEFAULT_CLOUD_CFG = {
        url: 'https://njakznrfyjgmsymayzaz.supabase.co',
        anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5qYWt6bnJmeWpnbXN5bWF5emF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NDQzNzYsImV4cCI6MjExMDIyMDM3Nn0.cZdzbDd-vIDHEAt8DLx0U3te1XKbXqdQH_fOkYdmU7M',
        connected: true
      };

      function loadCloudConfig() {
        try {
          const raw = localStorage.getItem(CLOUD_CFG_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.url && parsed.anonKey) return parsed;
          }
        } catch (e) {}
        return { ...DEFAULT_CLOUD_CFG };
      }

      let state = loadState();
      let cloudCfg = loadCloudConfig();
      let chartInstances = {};

      function applyHashRoute() {
        const h = (window.location.hash || '').toLowerCase();
        if (h === '#student') state.view = 'STUDENT_LANDING';
        else if (h === '#staff') state.view = 'STAFF_LANDING';
        else if (h === '#monitor') state.view = 'MONITOR';
      }
      applyHashRoute();

      async function pushTokenRowToSupabase(token) {
        if (!supabaseClient || !cloudCfg.connected || !token) return;
        try {
          await supabaseClient.from('cdws_tokens').upsert({
            id: token.id,
            tenant_id: state.activeTenantId,
            token_number: token.tokenNumber,
            prn: token.prn,
            student_name: token.studentName,
            service_id: token.serviceId,
            service_name: token.serviceName,
            doc_name: token.docName || '',
            assigned_window_id: token.assignedWindowId,
            eligible_windows_snapshot: token.eligibleWindowsSnapshot || [],
            status: token.status,
            created_at: new Date(token.createdAt || Date.now()).toISOString(),
            parked_at_served_count: token.parkedAtServedCount,
            recall_count: token.recallCount || 0,
            ack_status: token.ackStatus || 'NONE',
            ack_at: token.ackAt || null,
            alert_triggered: !!token.alertTriggered,
            client_request_id: token.clientRequestId,
            qr_code_value: token.qrCodeValue
          });
        } catch (e) {}
      }

      async function pushStateToSupabase() {
        if (!supabaseClient || !cloudCfg.connected) return;
        try {
          await supabaseClient.from('cdws_shared_state').upsert({
            id: state.activeTenantId,
            payload: state.tenants[state.activeTenantId],
            updated_at: new Date().toISOString()
          });
          const tokens = state.tenants[state.activeTenantId]?.tokens || [];
          if (tokens.length > 0) {
            await pushTokenRowToSupabase(tokens[tokens.length - 1]);
          }
        } catch (e) {}
      }

      function saveState(broadcast = true) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          if (broadcast && bc) {
            bc.postMessage({ type: 'STATE_UPDATED', tenantId: state.activeTenantId, ts: Date.now() });
          }
          if (broadcast && cloudCfg.connected) {
            pushStateToSupabase();
          }
        } catch (e) {}
      }

      function syncFromStorage() {
        const fresh = loadState();
        const keepView = state.view;
        const keepSession = state.session;
        const keepAdminTab = state.adminTab;
        const keepTenant = state.activeTenantId;
        state = fresh;
        state.view = keepView;
        state.session = keepSession;
        state.adminTab = keepAdminTab;
        state.activeTenantId = keepTenant;
        render();
      }

      if (bc) bc.onmessage = () => syncFromStorage();
      window.addEventListener('storage', (e) => { if (e.key === STORAGE_KEY) syncFromStorage(); });

      async function initSupabaseConnection(url, anonKey, silent = false) {
        const cleanUrl = String(url || '').trim().replace(/\/+$/, '');
        const cleanKey = String(anonKey || '').trim();
        if (!window.supabase || !cleanUrl || !cleanKey) return false;
        try {
          supabaseClient = window.supabase.createClient(cleanUrl, cleanKey);
          const { data, error } = await supabaseClient.from('cdws_shared_state').select('*').eq('id', state.activeTenantId).maybeSingle();
          if (error) {
            if (!silent) showToast('Supabase error: ' + error.message, 'error');
            return false;
          }
          cloudCfg = { url: cleanUrl, anonKey: cleanKey, connected: true };
          try { localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cloudCfg)); } catch (e) {}

          if (data && data.payload) {
            state.tenants[state.activeTenantId] = data.payload;
            saveState(false);
          } else {
            await pushStateToSupabase();
          }

          if (supabaseChannel) {
            try { supabaseClient.removeChannel(supabaseChannel); } catch (e) {}
          }
          // Sync normalized cdws_tokens rows if table exists
          try {
            const { data: normTokens, error: normErr } = await supabaseClient
              .from('cdws_tokens')
              .select('*')
              .eq('tenant_id', state.activeTenantId)
              .order('created_at', { ascending: true });
            if (!normErr && Array.isArray(normTokens) && normTokens.length > 0) {
              state.tenants[state.activeTenantId].tokens = normTokens.map(row => ({
                id: row.id,
                tokenNumber: row.token_number,
                prn: row.prn,
                studentName: row.student_name,
                serviceId: row.service_id,
                serviceName: row.service_name,
                docName: row.doc_name || '',
                assignedWindowId: row.assigned_window_id,
                eligibleWindowsSnapshot: row.eligible_windows_snapshot || [],
                status: row.status,
                createdAt: new Date(row.created_at).getTime(),
                parkedAtServedCount: row.parked_at_served_count,
                recallCount: row.recall_count || 0,
                ackStatus: row.ack_status || 'NONE',
                ackAt: row.ack_at || null,
                alertTriggered: !!row.alert_triggered,
                clientRequestId: row.client_request_id,
                qrCodeValue: row.qr_code_value
              }));
            }
          } catch (e) {}

          supabaseChannel = supabaseClient
            .channel('cdws2-realtime')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'cdws_shared_state' }, (payload) => {
              if (payload.new && payload.new.id === state.activeTenantId && payload.new.payload) {
                const incoming = payload.new.payload;
                const current = state.tenants[state.activeTenantId];
                // Preserve any tokens created concurrently unless incoming explicitly reset tokens to empty
                if (incoming.tokens && incoming.tokens.length > 0 && current && current.tokens) {
                  const byId = new Map(current.tokens.map(t => [t.id, t]));
                  incoming.tokens.forEach(t => byId.set(t.id, t));
                  incoming.tokens = Array.from(byId.values()).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
                }
                state.tenants[state.activeTenantId] = incoming;
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
                render();
              }

      let audioCtx = null;
      function unlockAudio() {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch (e) {}
      }

      function playProximityAlarm() {
        try {
          if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 300]);
          unlockAudio();
          if (!audioCtx) return;
          [587.33, 783.99, 1046.50].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.18);
            gain.gain.setValueAtTime(0.18, audioCtx.currentTime + i * 0.18);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.18 + 0.32);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + i * 0.18);
            osc.stop(audioCtx.currentTime + i * 0.18 + 0.35);
          });
        } catch (e) {}
      }

      function getEstimatedWaitMinutes(token) {
        const td = getTenantData();
        const winTokens = td.tokens.filter(t => t.assignedWindowId === token.assignedWindowId && ['SERVING', 'CALLED', 'WAITING'].includes(t.status));
        let mins = 0;
        for (const t of winTokens) {
          if (t.id === token.id) break;
          const srv = td.services.find(s => s.id === t.serviceId);
          mins += (srv ? srv.avgMinutes : 5);
        }
        return mins;
      }

      function allocateWindowForService(service) {
        const td = getTenantData();
        const openEligible = td.windows.filter(w => service.eligibleWindows.includes(w.id) && w.status === 'OPEN');
        if (openEligible.length === 0) return null;

        let bestWindow = openEligible[0];
        let bestEstMinutes = Infinity;

        openEligible.forEach(w => {
          const activeTokens = td.tokens.filter(t => t.assignedWindowId === w.id && ['WAITING', 'CALLED', 'SERVING'].includes(t.status));
          const estMinutes = activeTokens.reduce((sum, t) => {
            const srv = td.services.find(s => s.id === t.serviceId);
            return sum + (srv ? srv.avgMinutes : 5);
          }, 0);
          if (estMinutes < bestEstMinutes) {
            bestEstMinutes = estMinutes;
            bestWindow = w;
          }
        });

        return { window: bestWindow, estimatedWaitMinutes: bestEstMinutes };
      }


      async function issueAuthoritativeTokenCloud({ prn, studentName, serviceId, docName = '', clientRequestId = null }) {
        const td = getTenantData();
        const meta = getTenantMeta();
        if (td.cutoffClosed) return { ok: false, code: 'CUTOFF_EXPIRED', error: 'Service intake cutoff is currently active.' };
        const service = td.services.find(s => s.id === serviceId && s.enabled);
        if (!service) return { ok: false, code: 'SERVICE_UNAVAILABLE', error: 'Selected service is disabled.' };

        const existingActive = td.tokens.find(t =>
          t.prn === prn && t.serviceId === serviceId &&
          ['WAITING', 'CALLED', 'SERVING', 'PARKED'].includes(t.status)
        );
        if (existingActive) {
          return { ok: false, code: 'DUPLICATE_ACTIVE_TOKEN', error: `Active token ${existingActive.tokenNumber} already exists for PRN ${prn}.` };
        }

        const allocation = allocateWindowForService(service);
        if (!allocation) return { ok: false, code: 'NO_OPEN_WINDOW', error: `No eligible windows (${service.eligibleWindows.join(', ')}) are OPEN.` };

        const prefix = service.poolType === 'LIBRARY' ? 'L' : service.poolType === 'EXAM_SCHOLARSHIP' ? 'E' : service.poolType === 'CUSTOM' ? 'C' : 'A';
        if (supabaseClient && cloudCfg.connected) {
          try {
            const { data, error } = await supabaseClient.rpc('issue_cdws_token_atomic', {
              p_tenant_id: state.activeTenantId,
              p_prefix: prefix,
              p_prn: prn,
              p_student_name: studentName || 'Student',
              p_service_id: service.id,
              p_service_name: service.name,
              p_doc_name: docName || '',
              p_window_id: allocation.window.id,
              p_eligible_windows: service.eligibleWindows,
              p_qr_code: `CDWS2|${meta.code}|${prefix}-SEQ|${allocation.window.id}|LIVE`
            });
            if (!error && data) {
              const row = Array.isArray(data) ? data[0] : data;
              if (row && row.token_number) {
                const token = {
                  id: row.id,
                  tokenNumber: row.token_number,
                  prn: row.prn,
                  studentName: row.student_name,
                  serviceId: row.service_id,
                  serviceName: row.service_name,
                  docName: row.doc_name || '',
                  assignedWindowId: row.assigned_window_id,
                  eligibleWindowsSnapshot: row.eligible_windows_snapshot || [...service.eligibleWindows],
                  status: row.status,
                  createdAt: new Date(row.created_at).getTime(),
                  parkedAtServedCount: null,
                  recallCount: 0,
                  ackStatus: 'NONE',
                  ackAt: null,
                  alertTriggered: false,
                  clientRequestId,
                  qrCodeValue: row.qr_code_value
                };
                if (!td.tokens.some(x => x.id === token.id)) td.tokens.push(token);
                logAudit('SERVER_ENGINE', 'TOKEN_ISSUED', token.tokenNumber, `Atomic server sequence allocated to ${token.assignedWindowId} for PRN ${prn}.`);
                saveState(false);
                try {
                  await supabaseClient.from('cdws_shared_state').upsert({
                    id: state.activeTenantId,
                    payload: state.tenants[state.activeTenantId],
                    updated_at: new Date().toISOString()
                  });
                } catch (e) {}
                return { ok: true, token, estimatedWaitMinutes: allocation.estimatedWaitMinutes };
              }
            }
          } catch (e) {}
        }
        return issueAuthoritativeToken({ prn, studentName, serviceId, docName, clientRequestId });
      }

      function issueAuthoritativeToken({ prn, studentName, serviceId, docName = '', clientRequestId = null }) {
        const td = getTenantData();
        const meta = getTenantMeta();

        if (td.cutoffClosed) return { ok: false, code: 'CUTOFF_EXPIRED', error: 'Service intake cutoff is currently active.' };
        const service = td.services.find(s => s.id === serviceId && s.enabled);
        if (!service) return { ok: false, code: 'SERVICE_UNAVAILABLE', error: 'Selected service is disabled.' };

        const existingActive = td.tokens.find(t =>
          t.prn === prn && t.serviceId === serviceId &&
          ['WAITING', 'CALLED', 'SERVING', 'PARKED'].includes(t.status)
        );
        if (existingActive) {
          return { ok: false, code: 'DUPLICATE_ACTIVE_TOKEN', error: `Active token ${existingActive.tokenNumber} already exists for PRN ${prn}.` };
        }

        const allocation = allocateWindowForService(service);
        if (!allocation) return { ok: false, code: 'NO_OPEN_WINDOW', error: `No eligible windows (${service.eligibleWindows.join(', ')}) are OPEN.` };

        const prefix = service.poolType === 'LIBRARY' ? 'L' : service.poolType === 'EXAM_SCHOLARSHIP' ? 'E' : service.poolType === 'CUSTOM' ? 'C' : 'A';
        const seq = td.nextTokenSeq++;
        const tokenNumber = `${prefix}-${seq}`;
        const tokenId = `T-${seq}`;

        if (docName) {
          const cleanDoc = docName.trim();
          const dup = td.documents.find(d => d.prn === prn && d.docName.toLowerCase() === cleanDoc.toLowerCase());
          const docRec = {
            id: 'DOC-' + Math.random().toString(36).slice(2, 7).toUpperCase(),
            prn, studentName, docName: cleanDoc, tokenNumber, uploadedAt: nowTimeStr(), createdAt: Date.now()
          };
          td.documents.push(docRec);
          if (dup) {
            td.cleanupItems.unshift({
              id: 'CLN-' + docRec.id,
              category: 'DUPLICATE_DOCUMENT',
              title: `Duplicate Document: ${cleanDoc} (PRN: ${prn})`,
              detail: `Submitted again with ${tokenNumber} (matches earlier ${dup.tokenNumber}). Flagged for Principal/Admin review.`,
              refId: docRec.id,
              dismissed: false
            });
            logAudit('SYSTEM', 'DUPLICATE_DOC_FLAGGED', cleanDoc, `Duplicate document detected for PRN ${prn}.`);
          }
        }

        const token = {
          id: tokenId, tokenNumber, prn, studentName: studentName || 'Student',
          serviceId: service.id, serviceName: service.name, docName: docName || '',
          assignedWindowId: allocation.window.id, eligibleWindowsSnapshot: [...service.eligibleWindows],
          status: 'WAITING', createdAt: Date.now(), parkedAtServedCount: null, recallCount: 0,
          ackStatus: 'NONE', ackAt: null, alertTriggered: false, clientRequestId, qrCodeValue: `CDWS2|${meta.code}|${tokenNumber}|${allocation.window.id}|DEMO`
        };

        td.tokens.push(token);
        logAudit('SERVER_ENGINE', 'TOKEN_ISSUED', tokenNumber, `Allocated to ${allocation.window.id} (est. ${allocation.estimatedWaitMinutes}m) for PRN ${prn}.`);
        saveState();
        return { ok: true, token, estimatedWaitMinutes: allocation.estimatedWaitMinutes };
      }

      function run30DayRetentionScan() {
        const td = getTenantData();
        const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
        const now = Date.now();
        let added = 0;

        td.tokens.forEach(t => {
          if (t.status === 'COMPLETED' && t.docName && (now - t.createdAt) > thirtyDaysMs) {
            const clnId = 'CLN-RET-' + t.id;
            if (!td.cleanupItems.some(c => c.id === clnId)) {
              td.cleanupItems.unshift({
                id: clnId,
                category: 'RETENTION_30_DAYS',
                title: `30+ Day Old Attachment: ${t.docName} (${t.tokenNumber})`,
                detail: `Completed over 30 days ago for PRN ${t.prn}. Eligible for Principal/Admin deletion.`,
                refId: t.id,
                dismissed: false
              });
              added++;
            }
          }
        });

        // Also flag if no 30-day items exist yet so user can see how the scan works
        if (added === 0 && td.documents.length > 0) {
          const latestDoc = td.documents[td.documents.length - 1];
          const clnId = 'CLN-RET-DEMO-' + latestDoc.id;
          if (!td.cleanupItems.some(c => c.id === clnId)) {
            td.cleanupItems.unshift({
              id: clnId,
              category: 'RETENTION_30_DAYS',
              title: `Retention Policy Check: ${latestDoc.docName} (${latestDoc.tokenNumber})`,
              detail: `Simulated 30-day retention match for PRN ${latestDoc.prn} — ready for Principal review.`,
              refId: latestDoc.id,
              dismissed: false
            });
            added++;
          }
        }

        logAudit('SYSTEM', 'RETENTION_SCAN_RUN', getTenantMeta().code, `30-day retention scan flagged ${added} item(s).`);
        saveState();
        render();
        showToast(added > 0 ? `Retention scan flagged ${added} item(s) for Principal review.` : 'No new 30-day items found.', 'info');
      }

      function syncOfflineOutbox() {
        const td = getTenantData();
        if (state.offlineMode) { showToast('Switch to Online mode before syncing.', 'warning'); return; }
        if (td.offlineOutbox.length === 0) { showToast('No offline requests to sync.', 'info'); return; }

        let syncedCount = 0;
        let failedCount = 0;

        td.offlineOutbox.forEach(req => {
          if (req.syncStatus !== 'PENDING_SYNC') return;
          const res = issueAuthoritativeToken({
            prn: req.prn, studentName: req.studentName, serviceId: req.serviceId,
            docName: req.docName, clientRequestId: req.clientRequestId
          });
          if (res.ok) {
            req.syncStatus = 'SYNCED';
            req.issuedTokenNumber = res.token.tokenNumber;
            req.assignedWindowId = res.token.assignedWindowId;
            syncedCount++;
          } else {
            req.syncStatus = res.code;
            req.errorReason = res.error;
            failedCount++;
          }
        });

        saveState();
        render();
        if (syncedCount > 0) showToast(`Synced ${syncedCount} offline request(s).`, 'success');
        if (failedCount > 0) showToast(`${failedCount} offline request(s) rejected.`, 'warning');
      }

            ctx.font = '13px monospace';

            ctx.font = 'bold 14px Inter, sans-serif';

          document.getElementById('stu-name').value = sampleNames[Math.floor(Math.random() * sampleNames.length)];
          document.getElementById('stu-prn').value = '20240164' + String(Math.floor(1000 + Math.random() * 8999));
          document.getElementById('stu-doc').value = 'id_card_scan.pdf';
          document.getElementById('stu-form-error').classList.add('hidden');
        });

        document.getElementById('student-token-form').addEventListener('submit', async (e) => {
          unlockAudio();
          try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (err) {}
          e.preventDefault();
          const errEl = document.getElementById('stu-form-error');
          errEl.classList.add('hidden');
          const studentName = document.getElementById('stu-name').value.trim();
          const prn = document.getElementById('stu-prn').value.trim();
          const serviceId = document.getElementById('stu-service').value;
          const docName = document.getElementById('stu-doc').value.trim();
          const srv = td.services.find(s => s.id === serviceId);

          if (!studentName) { errEl.textContent = 'Please enter the student name.'; errEl.classList.remove('hidden'); return; }
          if (!/^[a-zA-Z0-9]{6,20}$/.test(prn)) { errEl.textContent = 'PRN must be 6–20 letters or digits.'; errEl.classList.remove('hidden'); return; }

          if (state.offlineMode) {
            const reqId = 'OFF-' + Math.random().toString(36).slice(2, 7).toUpperCase();
            td.offlineOutbox.unshift({ clientRequestId: reqId, prn, studentName, serviceId, serviceName: srv ? srv.name : serviceId, docName, syncStatus: 'PENDING_SYNC', createdAt: Date.now() });
            logAudit('STUDENT', 'OFFLINE_REQUEST_QUEUED', reqId, `Queued offline intake for PRN ${prn}.`);
            saveState();
            render();
            showToast('Saved to Offline Outbox.', 'warning');
            return;
          }

          const nowMs = Date.now();
          if (nowMs - lastTokenIssueAt < 30000) {
            const waitSec = Math.ceil((30000 - (nowMs - lastTokenIssueAt)) / 1000);
            errEl.textContent = `Rate limit: Please wait ${waitSec}s before requesting another token.`;
            errEl.classList.remove('hidden');
            return;
          }
          const res = await issueAuthoritativeTokenCloud({ prn, studentName, serviceId, docName });
          if (!res.ok) { errEl.textContent = res.error; errEl.classList.remove('hidden'); return; }
          saveLastTokenTime(Date.now());
          addMyTokenId(res.token.id);
          saveState();
          render();
          showToast(`Token ${res.token.tokenNumber} assigned to ${res.token.assignedWindowId}!`, 'success');
          openQrModal(res.token.id);
        });

        document.getElementById('btn-sync-offline').addEventListener('click', syncOfflineOutbox);
        root.querySelectorAll('[data-qr-token]').forEach(btn => btn.addEventListener('click', () => openQrModal(btn.getAttribute('data-qr-token'))));
        root.querySelectorAll('[data-ack-token]').forEach(btn => btn.addEventListener('click', () => {

          saveState();

          showToast(`Confirmed! Operator at ${t.assignedWindowId} notified you are coming.`, 'success');
        }));
        root.querySelectorAll('[data-test-alarm]').forEach(btn => btn.addEventListener('click', () => {
          const t = td.tokens.find(x => x.id === btn.getAttribute('data-test-alarm'));
          if (!t) return;
          t.ackStatus = 'NONE';
          t.alertTriggered = false;
          playProximityAlarm();
          triggerBrowserNotification(`CDWS 2.0 — Token ${t.tokenNumber}`, `5-Min Alarm! Come to ${t.assignedWindowId}.`);
          render();
          showToast(`5-Min Alarm triggered for ${t.tokenNumber}!`, 'warning');
        }));
      }

          const b1 = document.getElementById('op-start-serving');

        }));
      }

            <div class="flex flex-wrap gap-x-4 gap-y-2 border-b border-cream-300">

        document.getElementById('btn-poster-modal').addEventListener('click', openStudentPosterModal);

        else if (state.adminTab === 'CONFIG') renderAdminConfig(body, td);
        else if (state.adminTab === 'NOTICES') renderAdminNotices(body, td);
        else renderAdminAudit(body, td);
      }

      function renderAdminAnalytics(container, td) {
        const now = Date.now();
        const weekMs = 7 * 86400000;
        const monthMs = 30 * 86400000;
        const completedTokens = td.tokens.filter(t => t.status === 'COMPLETED');
        const serviceRows = td.services.map(s => {
          const allForSrv = td.tokens.filter(t => t.serviceId === s.id);
          return {
            name: s.name,
            weekCount: allForSrv.filter(t => (now - t.createdAt) <= weekMs).length,
            monthCount: allForSrv.filter(t => (now - t.createdAt) <= monthMs).length,
            doneCount: allForSrv.filter(t => t.status === 'COMPLETED').length
          };
        });

        container.innerHTML = `
          <div class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="bg-white p-5 rounded-2xl border border-cream-300"><div class="text-xs text-stone-500">Total Real Tokens Issued</div><div class="text-2xl font-extrabold text-stone-900 mt-1">${td.tokens.length}</div></div>
              <div class="bg-white p-5 rounded-2xl border border-cream-300"><div class="text-xs text-stone-500">Real Completed Services</div><div class="text-2xl font-extrabold text-forest-800 mt-1">${completedTokens.length}</div></div>
              <div class="bg-white p-5 rounded-2xl border border-cream-300"><div class="text-xs text-stone-500">Currently Waiting</div><div class="text-2xl font-extrabold text-bronze-600 mt-1">${td.tokens.filter(t => t.status === 'WAITING').length}</div></div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-cream-300 shadow-2xs">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                <div><h2 class="text-base font-bold text-stone-900">Weekly &amp; Monthly Service Report</h2><p class="text-xs text-stone-500">Computed strictly from real tokens issued in this system.</p></div>
                <button id="btn-export-csv" class="px-3 py-1.5 rounded-lg bg-forest-800 text-white text-xs font-semibold hover:bg-forest-900">Download CSV Report</button>
              </div>
              <div class="overflow-x-auto"><table class="w-full text-left text-xs sm:text-sm border-collapse"><thead><tr class="border-b border-cream-200 text-stone-500 text-xs"><th class="py-2 pr-3">Service Name</th><th class="py-2 pr-3 text-right">This Week (7d)</th><th class="py-2 pr-3 text-right">This Month (30d)</th><th class="py-2 text-right">Completed</th></tr></thead><tbody class="divide-y divide-cream-100">${serviceRows.map(r => `<tr><td class="py-2.5 pr-3 font-semibold text-stone-800">${escapeHtml(r.name)}</td><td class="py-2.5 pr-3 text-right font-mono">${r.weekCount}</td><td class="py-2.5 pr-3 text-right font-mono">${r.monthCount}</td><td class="py-2.5 text-right font-mono font-bold text-forest-800">${r.doneCount}</td></tr>`).join('')}</tbody></table></div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div class="bg-white p-5 rounded-2xl border border-cream-300"><h3 class="text-sm font-bold text-stone-900 mb-3">Served Volume by Window (W1–W7)</h3><div class="relative h-72"><canvas id="chart-windows"></canvas></div></div>
              <div class="bg-white p-5 rounded-2xl border border-cream-300"><h3 class="text-sm font-bold text-stone-900 mb-3">Real Queue Status Distribution</h3><div class="relative h-72"><canvas id="chart-status"></canvas></div></div>
            </div>
          </div>
        `;

        document.getElementById('btn-export-csv').addEventListener('click', () => {
          const lines = ['Service,This Week,This Month,Completed', ...serviceRows.map(r => `"${r.name}",${r.weekCount},${r.monthCount},${r.doneCount}`)];
          const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = `cdws2_report_${getTenantMeta().code}.csv`; a.click(); URL.revokeObjectURL(url);
        });

        setTimeout(() => {
          if (!window.Chart) return;
          if (chartInstances.win) chartInstances.win.destroy();
          if (chartInstances.status) chartInstances.status.destroy();
          const ctxWin = document.getElementById('chart-windows');
          if (ctxWin) chartInstances.win = new Chart(ctxWin, { type: 'bar', data: { labels: td.windows.map(w => w.id), datasets: [{ label: 'Served', data: td.windows.map(w => w.servedCount), backgroundColor: '#1B4332', borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } } });
          const statuses = ['WAITING', 'CALLED', 'SERVING', 'PARKED', 'COMPLETED', 'NO_SHOW_CANCELLED'];
          const ctxSt = document.getElementById('chart-status');
          if (ctxSt) chartInstances.status = new Chart(ctxSt, { type: 'doughnut', data: { labels: statuses, datasets: [{ data: statuses.map(st => td.tokens.filter(t => t.status === st).length), backgroundColor: ['#1B4332', '#0284c7', '#2D6A4F', '#D97706', '#44403C', '#be123c'] }] }, options: { responsive: true, maintainAspectRatio: false } });
        }, 0);

        const items = td.cleanupItems.filter(c => !c.dismissed);
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-cream-300 p-5 sm:p-6 shadow-2xs space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-cream-200 pb-4">
              <div>
                <h2 class="text-base font-bold text-stone-900">Principal / Vice-Principal Cleanup Reminder</h2>
                <p class="text-xs text-stone-500 mt-0.5">Flags expired notices, duplicate documents, and 30-day retention items. Check the ✅ boxes below each item to delete or keep.</p>
              </div>
              <div class="flex flex-wrap gap-2">
                <button id="cln-retention-scan" class="px-3 py-1.5 rounded-lg bg-cream-200 border border-cream-300 text-stone-900 text-xs font-bold hover:bg-cream-300">Run 30-Day Retention Scan</button>

                <button id="cln-keep-selected" class="px-3.5 py-1.5 rounded-lg bg-forest-800 text-white text-xs font-bold hover:bg-forest-900">Keep Checked</button>
              </div>
            </div>
            ${items.length === 0 ? `<div class="p-8 text-center text-sm text-stone-500 bg-cream-50 rounded-xl border border-cream-200">All clear! No items pending Principal review.</div>` : `
              <div class="space-y-3">
                ${items.map(item => {
                  const checked = !!state.cleanupSelected[item.id];
                  return `
                    <div class="p-4 rounded-xl border ${checked ? 'bg-rose-50/60 border-rose-300' : 'bg-cream-50 border-cream-200'}">
                      <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-cream-200 text-stone-800">${escapeHtml(item.category.replace(/_/g, ' '))}</span>
                      <h3 class="font-bold text-sm text-stone-900 mt-1">${escapeHtml(item.title)}</h3>
                      <p class="text-xs text-stone-600 mt-0.5">${escapeHtml(item.detail)}</p>
                      <label class="mt-3 inline-flex items-center gap-2 cursor-pointer select-none pt-2 border-t border-cream-200 w-full text-xs font-semibold text-stone-800">
                        <input type="checkbox" data-cln-check="${item.id}" ${checked ? 'checked' : ''} class="w-4 h-4 accent-forest-800 rounded" />
                        <span>✅ Mark for action (Delete or Keep)</span>
                      </label>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        `;

        document.getElementById('cln-retention-scan').addEventListener('click', run30DayRetentionScan);
        container.querySelectorAll('[data-cln-check]').forEach(cb => cb.addEventListener('change', () => { state.cleanupSelected[cb.getAttribute('data-cln-check')] = cb.checked; render(); }));
        document.getElementById('cln-select-all').addEventListener('click', () => { items.forEach(i => { state.cleanupSelected[i.id] = true; }); render(); });
        document.getElementById('cln-delete-selected').addEventListener('click', () => {
          const ids = items.filter(i => state.cleanupSelected[i.id]).map(i => i.id);
          if (ids.length === 0) { showToast('Check at least one item.', 'warning'); return; }
          ids.forEach(id => {
            const it = td.cleanupItems.find(x => x.id === id);
            if (it && it.category === 'EXPIRED_NOTICE' && it.refId) td.notices = td.notices.filter(n => n.id !== it.refId);
            if (it && it.category === 'DUPLICATE_DOCUMENT' && it.refId) td.documents = td.documents.filter(d => d.id !== it.refId);
            logAudit('ADMIN', 'CLEANUP_DELETED', it ? it.title : id, 'Principal/Admin approved deletion.');
            delete state.cleanupSelected[id];
          });
          td.cleanupItems = td.cleanupItems.filter(x => !ids.includes(x.id));
          saveState(); render(); showToast(`Deleted ${ids.length} item(s).`, 'success');
        });
        document.getElementById('cln-keep-selected').addEventListener('click', () => {
          const ids = items.filter(i => state.cleanupSelected[i.id]).map(i => i.id);
          if (ids.length === 0) { showToast('Check at least one item.', 'warning'); return; }
          ids.forEach(id => {
            const it = td.cleanupItems.find(x => x.id === id);

          });
          saveState(); render(); showToast(`Kept ${ids.length} item(s).`, 'info');
        });

      function renderAdminConfig(container, td) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-cream-300 p-5 shadow-2xs space-y-4">
            <div class="p-3 rounded-xl bg-cream-100 border border-cream-300 text-xs text-stone-800"><strong>In-Flight Token Safety:</strong> Updating eligible windows for W1–W4 applies strictly to future tokens.</div>
            <div class="overflow-x-auto"><table class="w-full text-left text-xs sm:text-sm border-collapse"><thead><tr class="border-b border-cream-200 text-stone-500 text-xs"><th class="py-2 pr-3">Service</th><th class="py-2 pr-3">Pool</th><th class="py-2 pr-3">Eligible Windows</th><th class="py-2 text-right">Status</th></tr></thead><tbody class="divide-y divide-cream-100">${td.services.map(s => `<tr><td class="py-3 pr-3 font-semibold">${escapeHtml(s.name)}</td><td class="py-3 pr-3 text-xs text-stone-500">${escapeHtml(s.poolType)}</td><td class="py-3 pr-3">${s.poolType === 'SHARED_POOL' ? `<div class="flex flex-wrap gap-1.5">${['W1','W2','W3','W4'].map(wid => `<button data-srv-win="${s.id}:${wid}" class="px-2 py-0.5 rounded text-xs font-semibold border ${s.eligibleWindows.includes(wid) ? 'bg-forest-800 text-white border-forest-800' : 'bg-white text-stone-600 border-cream-300'}">${wid}</button>`).join('')}</div>` : `<span class="px-2 py-0.5 rounded bg-cream-100 text-xs font-semibold">${escapeHtml(s.eligibleWindows.join(', '))} (Fixed)</span>`}</td><td class="py-3 text-right"><button data-toggle-srv="${s.id}" class="px-2.5 py-1 rounded-lg text-xs font-semibold ${s.enabled ? 'bg-emerald-100 text-emerald-800' : 'bg-stone-200 text-stone-600'}">${s.enabled ? 'Enabled' : 'Disabled'}</button></td></tr>`).join('')}</tbody></table></div>
          </div>
        `;
        container.querySelectorAll('[data-srv-win]').forEach(btn => btn.addEventListener('click', () => {
          const [sid, wid] = btn.getAttribute('data-srv-win').split(':');
          const srv = td.services.find(x => x.id === sid);
          if (!srv) return;
          if (srv.eligibleWindows.includes(wid)) { if (srv.eligibleWindows.length === 1) { showToast('Keep at least 1 window.', 'warning'); return; } srv.eligibleWindows = srv.eligibleWindows.filter(w => w !== wid); }
          else { srv.eligibleWindows.push(wid); srv.eligibleWindows.sort(); }
          logAudit('ADMIN', 'SERVICE_POOL_UPDATED', srv.name, `Windows: [${srv.eligibleWindows.join(', ')}]`); saveState(); render();
        }));
        container.querySelectorAll('[data-toggle-srv]').forEach(btn => btn.addEventListener('click', () => {
          const srv = td.services.find(x => x.id === btn.getAttribute('data-toggle-srv'));
          if (!srv) return;
          srv.enabled = !srv.enabled; logAudit('ADMIN', 'SERVICE_TOGGLED', srv.name, `Enabled: ${srv.enabled}`); saveState(); render();
        }));
      }

      function renderAdminNotices(container, td) {
        container.innerHTML = `
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <form id="admin-notice-form" class="lg:col-span-5 bg-white rounded-2xl border border-cream-300 p-5 shadow-2xs space-y-3">
              <h2 class="text-base font-bold text-stone-900">Publish New Notice</h2>
              <input id="not-title" type="text" required placeholder="Notice Headline" class="w-full text-sm bg-cream-50 border border-cream-300 rounded-xl px-3 py-2" />
              <textarea id="not-body" rows="3" required placeholder="Details..." class="w-full text-sm bg-cream-50 border border-cream-300 rounded-xl px-3 py-2"></textarea>
              <select id="not-priority" class="w-full text-sm bg-cream-50 border border-cream-300 rounded-xl px-3 py-2"><option value="NORMAL">NORMAL</option><option value="INFO">INFO</option><option value="URGENT">URGENT</option></select>
              <button type="submit" class="w-full py-2.5 rounded-xl bg-forest-800 text-white text-sm font-bold hover:bg-forest-900">Publish Notice</button>
            </form>
            <div class="lg:col-span-7 bg-white rounded-2xl border border-cream-300 p-5 shadow-2xs space-y-3">
              <h2 class="text-base font-bold text-stone-900">Campus Notices (${td.notices.length})</h2>
              ${td.notices.map(n => `<div class="p-3.5 rounded-xl border border-cream-200 bg-cream-50 flex items-start justify-between gap-3"><div><div class="font-bold text-sm">${escapeHtml(n.title)} <span class="text-[11px] px-1.5 py-0.5 rounded bg-cream-200">${escapeHtml(n.priority)}</span></div><p class="text-xs text-stone-600 mt-1">${escapeHtml(n.body)}</p></div><button data-del-notice="${n.id}" class="text-xs text-rose-600 font-semibold hover:underline">Delete</button></div>`).join('')}
            </div>
          </div>
        `;
        document.getElementById('admin-notice-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const title = document.getElementById('not-title').value.trim();
          const body = document.getElementById('not-body').value.trim();
          const priority = document.getElementById('not-priority').value;
          if (!title || !body) return;
          td.notices.unshift({ id: 'N-' + Date.now(), title, body, priority, active: true, expired: false, createdAt: 'Just now' });
          logAudit('ADMIN', 'NOTICE_PUBLISHED', title, `Priority: ${priority}`); saveState(); render();
        });
        container.querySelectorAll('[data-del-notice]').forEach(btn => btn.addEventListener('click', () => {
          td.notices = td.notices.filter(n => n.id !== btn.getAttribute('data-del-notice'));
          logAudit('ADMIN', 'NOTICE_DELETED', 'NOTICE', 'Removed notice.'); saveState(); render();
        }));
      }

      function renderAdminAudit(container, td) {
        const filtered = state.auditFilter === 'ALL' ? td.auditLogs : td.auditLogs.filter(l => l.role === state.auditFilter);
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-cream-300 p-5 shadow-2xs space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <h2 class="text-base font-bold text-stone-900">Immutable Campus Audit Trail</h2>
              <select id="audit-role-filter" class="text-xs border border-cream-300 rounded-lg px-2.5 py-1.5 bg-cream-50">
                ${['ALL','STUDENT','OPERATOR','SUPERVISOR','ADMIN','SERVER_ENGINE','SYSTEM'].map(r => `<option value="${r}" ${state.auditFilter === r ? 'selected' : ''}>Role: ${r}</option>`).join('')}
              </select>
            </div>
            <div class="overflow-x-auto max-h-96 overflow-y-auto"><table class="w-full text-left text-xs border-collapse"><thead><tr class="border-b border-cream-200 text-stone-500"><th class="py-2 pr-3">Time</th><th class="py-2 pr-3">Actor</th><th class="py-2 pr-3">Action</th><th class="py-2 pr-3">Target</th><th class="py-2">Detail</th></tr></thead><tbody class="divide-y divide-cream-100">${filtered.map(l => `<tr><td class="py-2 pr-3 font-mono text-stone-500">${escapeHtml(l.timestamp)}</td><td class="py-2 pr-3 font-semibold">${escapeHtml(l.role)}</td><td class="py-2 pr-3 font-mono text-forest-800">${escapeHtml(l.action)}</td><td class="py-2 pr-3 font-semibold">${escapeHtml(l.target)}</td><td class="py-2 text-stone-600">${escapeHtml(l.detail)}</td></tr>`).join('')}</tbody></table></div>
          </div>
        `;
        document.getElementById('audit-role-filter').addEventListener('change', (e) => { state.auditFilter = e.target.value; render(); });
      }

      function renderStatusBadge(status) {
        const map = { WAITING: 'bg-cream-200 text-stone-800', CALLED: 'bg-sky-100 text-sky-900', SERVING: 'bg-emerald-100 text-emerald-900', PARKED: 'bg-amber-100 text-amber-900', COMPLETED: 'bg-stone-200 text-stone-800', NO_SHOW_CANCELLED: 'bg-rose-100 text-rose-800' };
        return `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${map[status] || 'bg-stone-100 text-stone-700'}">${escapeHtml(status)}</span>`;
      }

      function render() {
        renderHeader();
        const root = document.getElementById('app-root');
        if (state.view === 'LANDING') renderLanding(root);
        else if (state.view === 'STUDENT_LANDING') renderStudentLanding(root);
        else if (state.view === 'STAFF_LANDING') renderStaffLanding(root);
        else if (state.view === 'MONITOR') renderMonitor(root);
        else if (state.view === 'STUDENT') renderStudent(root);
        else if (state.view === 'OPERATOR') renderOperator(root);
        else if (state.view === 'SUPERVISOR') renderSupervisor(root);
        else if (state.view === 'ADMIN') renderAdmin(root);
        else renderLanding(root);
      }

      document.getElementById('nav-logo').addEventListener('click', () => { window.location.hash = ''; state.view = 'LANDING'; saveState(false); render(); });
      document.getElementById('nav-portal-home').addEventListener('click', () => { window.location.hash = ''; state.view = 'LANDING'; saveState(false); render(); });
      document.getElementById('nav-portal-student').addEventListener('click', () => { window.location.hash = '#student'; state.view = 'STUDENT_LANDING'; saveState(false); render(); });
      document.getElementById('nav-portal-staff').addEventListener('click', () => { window.location.hash = '#staff'; state.view = 'STAFF_LANDING'; saveState(false); render(); });
      document.getElementById('nav-portal-monitor').addEventListener('click', () => { window.location.hash = '#monitor'; state.view = 'MONITOR'; saveState(false); render(); });
      document.getElementById('mob-nav-student').addEventListener('click', () => { window.location.hash = '#student'; state.view = 'STUDENT_LANDING'; saveState(false); render(); });
      document.getElementById('mob-nav-staff').addEventListener('click', () => { window.location.hash = '#staff'; state.view = 'STAFF_LANDING'; saveState(false); render(); });
      document.getElementById('mob-nav-monitor').addEventListener('click', () => { window.location.hash = '#monitor'; state.view = 'MONITOR'; saveState(false); render(); });


      document.getElementById('btn-back-main').addEventListener('click', () => { window.location.hash = ''; state.session = null; state.view = 'LANDING'; saveState(false); render(); });


      setInterval(() => {
        if (!document.hidden && state.view === 'STUDENT' && !state.noticePaused) {
          const td = getTenantData();
          if (td.notices.filter(n => n.active && !n.expired).length > 1) { state.noticeSlideIdx++; render(); }
        }
      }, 6500);

      try {
        if (/WhatsApp/i.test(navigator.userAgent || '')) {
          document.getElementById('wa-browser-tip')?.classList.remove('hidden');
        }
      } catch (e) {}
      render();
    })();
  </script>
</body>
</html>
